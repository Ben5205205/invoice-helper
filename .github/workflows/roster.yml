# 疏文法會名冊排版：LINE 小幫手按「確定製作」後呼叫（workflow_dispatch，只帶工作代碼）。
# 用 GitHub OIDC 向網站證明身分拿名單、上傳 PDF；名單不寫進紀錄、不留 artifact。
name: 名冊排版
on:
  workflow_dispatch:
    inputs:
      job: { description: "工作代碼", required: true }
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/roster }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.fonts, key: bpmf-iansui-v1 }
      - name: 字型（注音芫荽，OFL 授權）＋中文備用字型
        run: |
          mkdir -p ~/.fonts
          [ -f ~/.fonts/BpmfIansui-Regular.ttf ] || curl -sSfL -o ~/.fonts/BpmfIansui-Regular.ttf https://raw.githubusercontent.com/ButTaiwan/bpmfvs/master/fonts/BpmfIansui-Regular.ttf
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          fc-cache -f > /dev/null
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: 排版
        env: { JOB: "${{ inputs.job }}" }
        run: python scripts/roster/build.py --job "$JOB" --api https://taxtools.tw
